name: Jupyter Notebook Integrity

on:
  push:
    branches: [main]
    paths:
      - "**/*.ipynb"
      - "README.md"
      - "docs/**"
      - "tools/**"
      - "requirements*.txt"
      - ".github/workflows/notebook-audit.yml"
  pull_request:
    paths:
      - "**/*.ipynb"
      - "README.md"
      - "docs/**"
      - "tools/**"
      - "requirements*.txt"
      - ".github/workflows/notebook-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-design.txt
      - name: Validate notebook JSON without executing historical files
        run: python tools/check_notebooks.py
      - name: Install presentation checks and CPU starter dependencies
        run: python -m pip install -r requirements-design.txt
      - name: Verify all 66 notebook designs, embedded images and source preservation
        run: python tools/verify_notebook_design.py --repo-root .
      - name: Reproduce only the synthetic CPU MLP with untouched holdout data
        run: python tools/check_notebooks.py --run-example
      - name: Save presentation verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-presentation-verification
          path: reports/notebook-design/verification.json
          if-no-files-found: warn
          retention-days: 14
