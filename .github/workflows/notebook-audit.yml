name: AI PATH · 66 CPU Lessons

"on":
  push:
    branches: [main]
    paths:
      - "**/*.ipynb"
      - "README.md"
      - "docs/**"
      - "tools/**"
      - "assets/lesson-characters/**"
      - "requirements*.txt"
      - ".github/workflows/notebook-audit.yml"
  pull_request:
    paths:
      - "**/*.ipynb"
      - "README.md"
      - "docs/**"
      - "tools/**"
      - "assets/lesson-characters/**"
      - "requirements*.txt"
      - ".github/workflows/notebook-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lessons-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lessons:
    name: CPU lessons ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "001-022"
            ids: "001,002,003,004,005,006,007,008,009,010,011,012,013,014,015,016,017,018,019,020,021,022"
          - shard: "023-044"
            ids: "023,024,025,026,027,028,029,030,031,032,033,034,035,036,037,038,039,040,041,042,043,044"
          - shard: "045-066"
            ids: "045,046,047,048,049,050,051,052,053,054,055,056,057,058,059,060,061,062,063,064,065,066"
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
      - name: Prepare Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lessons.txt
      - name: Install the short lesson environment
        run: python -m pip install -r requirements-lessons.txt
      - name: Validate and execute each lesson in a fresh CPU kernel
        run: python tools/check_lessons.py --repo-root . --execute --ids "${{ matrix.ids }}"
      - name: Save execution and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-validation-${{ matrix.shard }}
          path: reports/lesson-validation.json
          if-no-files-found: warn
          retention-days: 14
